name: Publish AgentTX to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-agenttx-${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.3.0' }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.3.0' }}

jobs:
  verify-and-publish:
    if: github.repository == 'aliengineering-byte/agenttx'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/agenttx/v/0.3.0
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install --global npm@11.9.0
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "354225e8e5521631c8eb81bef6667aac923cb6d7"
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "0.3.0"
      - run: npm ci
      - name: Run source, adversarial, and deterministic demo gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run scan:secrets
          npm run check:links
          npm run release:verify
          npm run demo:proof
      - name: Pack and inspect the exact npm payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir .artifacts
          npm pack --pack-destination .artifacts --json > .artifacts/pack.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const [packed] = JSON.parse(await readFile(".artifacts/pack.json", "utf8"));
          if (packed.name !== "agenttx" || packed.version !== "0.3.0") throw new Error("Packed identity mismatch");
          const paths = packed.files.map((file) => file.path);
          for (const required of ["dist/src/cli.js", "scripts/proof-demo.mjs", "docs/PROOF_MODE.md"]) {
            if (!paths.includes(required)) throw new Error(`Missing ${required}`);
          }
          if (paths.some((path) => path.startsWith("src/") || path.includes("node_modules") || path.includes(".env"))) {
            throw new Error("Private build input entered the package");
          }
          NODE
          sha256sum .artifacts/agenttx-0.3.0.tgz > .artifacts/agenttx-0.3.0.sha256
          root="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$root" .artifacts/agenttx-0.3.0.tgz
          (cd "$root" && node node_modules/agenttx/scripts/proof-demo.mjs)
      - name: Attach immutable package artifacts without replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          download="$(mktemp -d)"
          for asset in agenttx-0.3.0.tgz agenttx-0.3.0.sha256; do
            if grep -Fxq "$asset" <<<"$existing"; then
              gh release download "$RELEASE_TAG" --dir "$download" --pattern "$asset"
              cmp --silent ".artifacts/$asset" "$download/$asset" || {
                echo "Existing immutable release asset differs: $asset" >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" ".artifacts/$asset"
            fi
          done
      - name: Publish through npm Trusted Publishing
        run: npm publish .artifacts/agenttx-0.3.0.tgz --access public --provenance
      - name: Verify the public package and proof path
        shell: bash
        run: |
          set -euo pipefail
          for delay in 2 4 8 16 30 30; do
            if test "$(npm view agenttx@0.3.0 version 2>/dev/null)" = 0.3.0; then break; fi
            sleep "$delay"
          done
          test "$(npm view agenttx@0.3.0 version)" = 0.3.0
          root="$(mktemp -d)"
          cd "$root"
          npm install --ignore-scripts agenttx@0.3.0
          npm audit signatures
          started="$(date +%s)"
          node node_modules/agenttx/scripts/proof-demo.mjs --output demo
          test "$(( $(date +%s) - started ))" -lt 60
