<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">AgentTX transaction flow</title>
  <desc id="description">The original repository stays untouched while an agent works in an isolated workspace. The user inspects and verifies, then commits or rolls back.</desc>
  <rect width="1200" height="430" fill="#ffffff"/>
  <style>.n{fill:#f6f8fa;stroke:#1f2328;stroke-width:2}.g{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}.r{fill:#ffebe9;stroke:#cf222e;stroke-width:2}.h{font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1f2328}.p{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#59636e}.a{stroke:#59636e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker></defs>
  <rect class="n" x="30" y="120" width="190" height="110" rx="12"/><text class="h" x="125" y="165" text-anchor="middle">Your repo</text><text class="p" x="125" y="198" text-anchor="middle">stays available</text>
  <rect class="g" x="280" y="105" width="220" height="140" rx="12"/><text class="h" x="390" y="150" text-anchor="middle">Transaction</text><text class="p" x="390" y="184" text-anchor="middle">isolated clone</text><text class="p" x="390" y="212" text-anchor="middle">agent works here</text>
  <rect class="n" x="560" y="105" width="210" height="140" rx="12"/><text class="h" x="665" y="150" text-anchor="middle">Review</text><text class="p" x="665" y="184" text-anchor="middle">diff · inspect</text><text class="p" x="665" y="212" text-anchor="middle">verify · report</text>
  <rect class="g" x="850" y="40" width="290" height="110" rx="12"/><text class="h" x="995" y="84" text-anchor="middle">COMMIT</text><text class="p" x="995" y="116" text-anchor="middle">accept after conflict checks</text>
  <rect class="r" x="850" y="250" width="290" height="110" rx="12"/><text class="h" x="995" y="294" text-anchor="middle">ROLLBACK</text><text class="p" x="995" y="326" text-anchor="middle">discard isolated changes</text>
  <path class="a" d="M220 175 H270"/><path class="a" d="M500 175 H550"/><path class="a" d="M770 155 C810 155 810 95 840 95"/><path class="a" d="M770 195 C810 195 810 305 840 305"/>
  <text class="p" x="600" y="405" text-anchor="middle">BEGIN → OBSERVE → INSPECT → VERIFY → COMMIT / ROLLBACK</text>
</svg>
