<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">AgentTX deterministic terminal demo</title>
  <desc id="description">A coding agent changes seven files and attempts a push. AgentTX blocks the push, rates the transaction high risk, and rolls back while leaving the original workspace unchanged.</desc>
  <rect width="1200" height="760" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="758" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="34" cy="32" r="7" fill="#ff7b72"/><circle cx="58" cy="32" r="7" fill="#d29922"/><circle cx="82" cy="32" r="7" fill="#3fb950"/>
  <text x="600" y="38" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">agenttx demo · deterministic · local · no credentials</text>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#30363d"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">
    <text x="34" y="98" fill="#8b949e">$</text><text x="58" y="98" fill="#f0f6fc">agenttx demo</text>
    <text x="34" y="140" fill="#f0f6fc">Starting demo transaction...</text>
    <text x="34" y="184" fill="#8b949e">Agent edits auth, dependencies, lockfile, CI, sessions, and legacy code.</text>
    <text x="34" y="226" fill="#ff7b72" font-weight="700">BLOCKED</text><text x="160" y="226" fill="#f0f6fc">git push origin main</text>
    <text x="34" y="272" fill="#58a6ff" font-weight="700">INSPECT</text>
    <text x="58" y="310" fill="#f0f6fc">7 files changed</text><text x="294" y="310" fill="#3fb950">+21</text><text x="354" y="310" fill="#ff7b72">-5</text>
    <text x="58" y="348" fill="#f0f6fc">Risk</text><text x="160" y="348" fill="#ff7b72" font-weight="700">HIGH (7)</text>
    <text x="58" y="386" fill="#d29922">• dependency manifest changed</text>
    <text x="58" y="424" fill="#d29922">• dependency lockfile changed</text>
    <text x="58" y="462" fill="#d29922">• external write detected and gated</text>
    <text x="34" y="516" fill="#58a6ff" font-weight="700">DIFF</text><text x="136" y="516" fill="#f0f6fc">4 modified · 2 added · 1 deleted</text>
    <text x="34" y="574" fill="#3fb950" font-weight="700">ROLLBACK</text>
    <text x="58" y="614" fill="#3fb950">✓ Transaction rolled back</text>
    <text x="58" y="652" fill="#3fb950">✓ 7 transaction changes discarded</text>
    <text x="58" y="690" fill="#3fb950" font-weight="700">✓ Original workspace UNCHANGED</text>
  </g>
  <text x="1166" y="728" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">representative output from the real offline demo</text>
</svg>
